[package]
name = "loadout"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Local companion for the Loadout MCP gateway"
repository = "https://github.com/Yanyutin753/loadout"
publish = false

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }

serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tempfile = "=3.27.0"
rpassword = "=7.5.4"
toml_edit = "=0.25.13"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "io-std", "process", "time"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }

[dev-dependencies]
axum = "=0.8.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
