root = "."
tmp_dir = "build/dev"
# Root pnpm dev loads .env; preserve exported environment precedence.
env_files = []

[build]
cmd = "cd server && CGO_ENABLED=0 go build -trimpath -o ../build/dev/loadout-server ./cmd/loadout-server"
entrypoint = ["./build/dev/loadout-server"]
include_dir = ["server"]
include_ext = ["go", "sql", "mod", "sum"]
exclude_dir = ["build", "server/data"]
exclude_regex = ["_test\\.go$"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "2s"
