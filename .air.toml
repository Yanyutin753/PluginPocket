root = "."
tmp_dir = "build/dev"
# Root pnpm dev loads .env; preserve exported environment precedence.
env_files = []

[build]
# -buildvcs=false: dev reload builds need no VCS stamping, and go build fails
# obtaining VCS status when run outside a git repo on a separate filesystem (e.g. /tmp).
cmd = "cd server && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../build/dev/pluginpocket-server ./cmd/pluginpocket-server"
entrypoint = ["./build/dev/pluginpocket-server"]
include_dir = ["server"]
include_ext = ["go", "sql", "mod", "sum"]
exclude_dir = ["build", "server/data"]
exclude_regex = ["_test\\.go$"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "2s"
