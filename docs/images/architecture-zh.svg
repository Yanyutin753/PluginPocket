<svg xmlns="http://www.w3.org/2000/svg" width="936" height="384" viewBox="0 0 936 384" role="img" aria-labelledby="pp-arch-title pp-arch-desc">
  <title id="pp-arch-title">PluginPocket 架构</title>
  <desc id="pp-arch-desc">AI 客户端通过 stdio 连接本地 bridge，bridge 以 Streamable HTTP 与 Bearer 鉴权访问 PluginPocket MCP 网关；网关对接预设 MCP 上游池，Web 控制台负责管理与用量，PostgreSQL 保存账号、会话与事务账本，Redis 作为可降级的元数据缓存。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#62646c"/>
    </marker>
  </defs>
  <style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans',sans-serif}</style>

  <rect x="1" y="1" width="934" height="382" rx="16" fill="#f5f5f7" stroke="#d8d9df" stroke-width="1.5"/>

  <!-- AI clients -->
  <rect x="24" y="72" width="150" height="130" rx="12" fill="#ffffff" stroke="#d8d9df" stroke-width="1.25"/>
  <text x="99" y="95" text-anchor="middle" font-size="11" fill="#62646c">AI 客户端</text>
  <rect x="38" y="106" width="122" height="26" rx="8" fill="#f5f5f7" stroke="#d8d9df"/>
  <text x="99" y="123" text-anchor="middle" font-size="12" fill="#202124">Codex</text>
  <rect x="38" y="136" width="122" height="26" rx="8" fill="#f5f5f7" stroke="#d8d9df"/>
  <text x="99" y="153" text-anchor="middle" font-size="12" fill="#202124">Claude Code</text>
  <rect x="38" y="166" width="122" height="26" rx="8" fill="#f5f5f7" stroke="#d8d9df"/>
  <text x="99" y="183" text-anchor="middle" font-size="12" fill="#202124">Cursor</text>

  <!-- local bridge -->
  <rect x="210" y="100" width="130" height="70" rx="12" fill="#d8eee0" stroke="#609575" stroke-width="1.5"/>
  <text x="275" y="131" text-anchor="middle" font-size="13.5" font-weight="600" fill="#202124">本地 bridge</text>
  <text x="275" y="150" text-anchor="middle" font-size="11" fill="#62646c">stdio ↔ HTTP</text>

  <!-- gateway -->
  <rect x="470" y="83" width="210" height="104" rx="14" fill="#ffe5a0" stroke="#b88a16" stroke-width="1.5"/>
  <text x="575" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">PluginPocket MCP 网关</text>
  <text x="575" y="153" text-anchor="middle" font-size="11" fill="#62646c">鉴权 · 计量 · 结算 · 退款</text>

  <!-- upstream pool -->
  <rect x="740" y="100" width="160" height="70" rx="12" fill="#d8eee0" stroke="#609575" stroke-width="1.5"/>
  <text x="820" y="131" text-anchor="middle" font-size="13.5" font-weight="600" fill="#202124">预设 MCP 上游池</text>
  <text x="820" y="150" text-anchor="middle" font-size="11" fill="#62646c">HTTP 工具服务</text>

  <!-- top edges -->
  <line x1="178" y1="135" x2="202" y2="135" stroke="#62646c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="192" y="123" text-anchor="middle" font-size="10.5" fill="#62646c">stdio</text>
  <line x1="344" y1="135" x2="462" y2="135" stroke="#62646c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="404" y="106" text-anchor="middle" font-size="10.5" fill="#62646c">Streamable HTTP</text>
  <text x="404" y="121" text-anchor="middle" font-size="10.5" fill="#62646c">Bearer 鉴权</text>
  <line x1="684" y1="135" x2="732" y2="135" stroke="#62646c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="710" y="123" text-anchor="middle" font-size="10.5" fill="#62646c">MCP</text>

  <!-- web console -->
  <rect x="470" y="295" width="124" height="60" rx="12" fill="#ffffff" stroke="#d8d9df" stroke-width="1.25"/>
  <text x="532" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Web 控制台</text>
  <text x="532" y="339" text-anchor="middle" font-size="10.5" fill="#62646c">管理与用量</text>
  <line x1="532" y1="291" x2="532" y2="191" stroke="#62646c" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- postgres -->
  <rect x="604" y="295" width="150" height="60" rx="12" fill="#ffffff" stroke="#d8d9df" stroke-width="1.25"/>
  <text x="679" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">PostgreSQL</text>
  <text x="679" y="339" text-anchor="middle" font-size="10.5" fill="#62646c">账号 · 会话 · 事务账本</text>
  <line x1="630" y1="191" x2="630" y2="291" stroke="#62646c" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- redis -->
  <rect x="770" y="295" width="150" height="60" rx="12" fill="#ffffff" stroke="#d8d9df" stroke-width="1.25"/>
  <text x="845" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Redis</text>
  <text x="845" y="339" text-anchor="middle" font-size="10.5" fill="#62646c">元数据缓存 · 可降级</text>
  <path d="M668 191 L668 240 L845 240 L845 291" fill="none" stroke="#62646c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
