[package]
name = "loadout-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[features]
default = ["native"]
native = ["dep:tauri", "dep:tauri-build"]

[dependencies]
loadout = { path = "../cli" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process"] }
tauri = { version = "=2.11.5", features = ["tray-icon"], optional = true }

[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true , features = [] }

[dev-dependencies]
tempfile = "=3.27.0"
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-async-rw"] }

[[bin]]
name = "loadout-desktop"
path = "src/main.rs"
required-features = ["native"]

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
