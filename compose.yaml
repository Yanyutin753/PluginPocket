services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: pluginpocket
      POSTGRES_USER: pluginpocket
      POSTGRES_PASSWORD: ${PLUGINPOCKET_DB_PASSWORD:?Set PLUGINPOCKET_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PLUGINPOCKET_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pluginpocket -d pluginpocket"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8.10.1-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    ports:
      - "127.0.0.1:${PLUGINPOCKET_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  pluginpocket:
    build: .
    ports:
      - "127.0.0.1:${PLUGINPOCKET_PORT:-8787}:8787"
    environment:
      PLUGINPOCKET_ADDR: 0.0.0.0:8787
      PLUGINPOCKET_DATABASE_URL: postgres://pluginpocket:${PLUGINPOCKET_DB_PASSWORD}@db:5432/pluginpocket?sslmode=disable
      PLUGINPOCKET_REDIS_URL: redis://redis:6379/0
      PLUGINPOCKET_REDIS_NAMESPACE: ${PLUGINPOCKET_REDIS_NAMESPACE:-pluginpocket}
      PLUGINPOCKET_PUBLIC_URL: ${PLUGINPOCKET_PUBLIC_URL:-http://localhost:8787}
      PLUGINPOCKET_ENCRYPTION_KEY: ${PLUGINPOCKET_ENCRYPTION_KEY:-}
      PLUGINPOCKET_ADMIN_USERNAME: ${PLUGINPOCKET_ADMIN_USERNAME:-}
      PLUGINPOCKET_ADMIN_PASSWORD: ${PLUGINPOCKET_ADMIN_PASSWORD:-}
      PLUGINPOCKET_INITIAL_CREDITS: ${PLUGINPOCKET_INITIAL_CREDITS:-1000}
      PLUGINPOCKET_GITHUB_CLIENT_ID: ${PLUGINPOCKET_GITHUB_CLIENT_ID:-}
      PLUGINPOCKET_GITHUB_CLIENT_SECRET: ${PLUGINPOCKET_GITHUB_CLIENT_SECRET:-}
      PLUGINPOCKET_GITHUB_ORG: ${PLUGINPOCKET_GITHUB_ORG:-}
      PLUGINPOCKET_SMTP_ADDRESS: ${PLUGINPOCKET_SMTP_ADDRESS:-}
      PLUGINPOCKET_SMTP_FROM: ${PLUGINPOCKET_SMTP_FROM:-}
      PLUGINPOCKET_SMTP_USERNAME: ${PLUGINPOCKET_SMTP_USERNAME:-}
      PLUGINPOCKET_SMTP_PASSWORD: ${PLUGINPOCKET_SMTP_PASSWORD:-}
      PLUGINPOCKET_SMTP_ALLOW_LOCAL_INSECURE: ${PLUGINPOCKET_SMTP_ALLOW_LOCAL_INSECURE:-false}
      PLUGINPOCKET_ALLOW_PRIVATE_UPSTREAMS: ${PLUGINPOCKET_ALLOW_PRIVATE_UPSTREAMS:-false}
      PLUGINPOCKET_STDIO_COMMANDS: ${PLUGINPOCKET_STDIO_COMMANDS:-}
      PLUGINPOCKET_FILE_STORAGE_INLINE_MAX_BYTES: ${PLUGINPOCKET_FILE_STORAGE_INLINE_MAX_BYTES:-262144}
      PLUGINPOCKET_FILE_STORAGE_ENDPOINT: ${PLUGINPOCKET_FILE_STORAGE_ENDPOINT:-}
      PLUGINPOCKET_FILE_STORAGE_REGION: ${PLUGINPOCKET_FILE_STORAGE_REGION:-}
      PLUGINPOCKET_FILE_STORAGE_BUCKET: ${PLUGINPOCKET_FILE_STORAGE_BUCKET:-}
      PLUGINPOCKET_FILE_STORAGE_ACCESS_KEY_ID: ${PLUGINPOCKET_FILE_STORAGE_ACCESS_KEY_ID:-}
      PLUGINPOCKET_FILE_STORAGE_SECRET_ACCESS_KEY: ${PLUGINPOCKET_FILE_STORAGE_SECRET_ACCESS_KEY:-}
      PLUGINPOCKET_FILE_STORAGE_SESSION_TOKEN: ${PLUGINPOCKET_FILE_STORAGE_SESSION_TOKEN:-}
      PLUGINPOCKET_FILE_STORAGE_PREFIX: ${PLUGINPOCKET_FILE_STORAGE_PREFIX:-}
      PLUGINPOCKET_FILE_STORAGE_PATH_STYLE: ${PLUGINPOCKET_FILE_STORAGE_PATH_STYLE:-false}
      PLUGINPOCKET_FILE_STORAGE_ALLOW_HTTP: ${PLUGINPOCKET_FILE_STORAGE_ALLOW_HTTP:-false}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres_data:
