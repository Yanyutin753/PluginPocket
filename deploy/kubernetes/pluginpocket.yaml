# Runbook: docs/CLUSTER.md; variable contract: docs/ENVIRONMENT.md
# Application only. Requires namespace pluginpocket, Secret pluginpocket-runtime,
# externally operated PostgreSQL/Redis, and an existing HTTPS ingress/gateway.
# Replace the image with your built immutable release digest before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pluginpocket
  namespace: pluginpocket
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pluginpocket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pluginpocket
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 70
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pluginpocket
      containers:
        - name: pluginpocket
          image: registry.example.com/pluginpocket:REPLACE_WITH_RELEASE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - secretRef:
                name: pluginpocket-runtime
          # These two paths belong to the supplied container, not the host.
          env:
            - name: PLUGINPOCKET_ADDR
              value: 0.0.0.0:8787
            - name: PLUGINPOCKET_WEB_DIR
              value: /app/web/dist
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # Kubelet-native sleep: the scratch image has no shell/sleep binary.
              # Drain endpoints before SIGTERM; application Shutdown is only 5s.
              sleep:
                seconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: pluginpocket
  namespace: pluginpocket
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: pluginpocket
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pluginpocket
  namespace: pluginpocket
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pluginpocket
