name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 与 release.yml 相同的已验证矩阵：cross 仅用于 musl，
  # arm64 走原生 ARM runner、Windows 走原生 msvc（cross 编译 windows-gnu 时
  # zerofrom 的 proc-macro 链接失败，见 2026-09-11 Build & Push 失败记录）。
  cli:
    name: CLI binaries (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-amd64
            ext: ""
            use-cross: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
            ext: ".exe"
            use-cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install cross
        if: matrix.use-cross == true
        run: cargo install cross

      - name: Build CLI binary
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}
          else
            cargo build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pluginpocket-${{ matrix.name }}
          path: cli/target/${{ matrix.target }}/release/pluginpocket${{ matrix.ext }}
