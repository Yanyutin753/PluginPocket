name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      redis:
        image: redis:8.10.1-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: pluginpocket_test
          POSTGRES_USER: pluginpocket
          POSTGRES_PASSWORD: ci-only-isolated-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pluginpocket -d pluginpocket_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PLUGINPOCKET_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      PLUGINPOCKET_TEST_DATABASE_URL: postgres://pluginpocket:ci-only-isolated-test-password@127.0.0.1:5432/pluginpocket_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Run full harness
        shell: bash
        run: make check 2>&1 | tee harness.log
      - name: Build container
        run: docker build -t pluginpocket:ci .
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: harness-results
          path: |
            harness.log
            desktop/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: ignore

  cli-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show active-toolchain
      - run: cargo fmt --manifest-path cli/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path cli/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path cli/Cargo.toml --locked
      - run: cargo build --manifest-path cli/Cargo.toml --locked --release
