name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - name: Run full harness
        shell: bash
        run: make check 2>&1 | tee harness.log
      - name: Build container
        run: docker build -t loadout:ci .
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: harness-results
          path: harness.log
          retention-days: 7
          if-no-files-found: ignore

  cli-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show active-toolchain
      - run: cargo fmt --manifest-path cli/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path cli/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path cli/Cargo.toml --locked
      - run: cargo build --manifest-path cli/Cargo.toml --locked --release
