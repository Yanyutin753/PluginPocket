name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 先创建空 Release（所有后续 job 构建完各自往里加产物）
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Loadout ${{ github.ref_name }}'
          body: |
            ## Loadout ${{ github.ref_name }}

            **Your AI, fully loaded.** 登录即武装的 MCP 生态。

            ### 快速开始
            ```bash
            # Linux
            curl -L https://github.com/Yanyutin753/loadout/releases/download/${{ github.ref_name }}/loadout-linux-amd64.tar.gz | tar xz
            # macOS ARM
            curl -L https://github.com/Yanyutin753/loadout/releases/download/${{ github.ref_name }}/loadout-darwin-arm64.tar.gz | tar xz

            loadout login --server https://loadout.lambchat.com
            loadout apply --clients codex
            loadout install starter-pack
            ```

            ### Codex 插件市场
            ```bash
            codex plugin marketplace add https://loadout.lambchat.com/marketplace.git
            ```
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CLI 多平台——每个构建完立刻上传到 Release
  cli:
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: loadout-linux-amd64
            ext: ""
            use-cross: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: loadout-linux-arm64
            ext: ""
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: loadout-windows-amd64
            ext: ".exe"
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: loadout-darwin-arm64
            ext: ""
            use-cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            name: loadout-darwin-amd64
            ext: ""
            use-cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install cross
        if: matrix.use-cross == true
        run: cargo install cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}
          else
            cargo build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}
          fi

      - name: Package & Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cli/target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../../${{ matrix.name }}.zip loadout${{ matrix.ext }}
            gh release upload ${{ github.ref_name }} ../../../${{ matrix.name }}.zip --clobber
          else
            tar czf ../../../${{ matrix.name }}.tar.gz loadout${{ matrix.ext }}
            gh release upload ${{ github.ref_name }} ../../../${{ matrix.name }}.tar.gz --clobber
          fi

  # Docker 镜像
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tauri 桌面端——tauri-action 构建完自动上传到 Release
  desktop:
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Install deps & build UI
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop/ui build

      - name: Build Tauri & Upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Loadout ${{ github.ref_name }}'
          releaseDraft: false
