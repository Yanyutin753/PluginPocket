name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # CLI 多平台原生构建
  cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: loadout-linux-amd64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: loadout-linux-arm64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: loadout-windows-amd64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            name: loadout-darwin-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            name: loadout-darwin-amd64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build
        run: cargo build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd cli/target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz loadout${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cli/${{ matrix.name }}.tar.gz

  # Docker 镜像
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tauri 桌面端（Linux + macOS + Windows）
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: loadout-desktop-linux-amd64
          - os: windows-latest
            name: loadout-desktop-windows-amd64
          - os: macos-latest
            name: loadout-desktop-darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Install deps
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web build

      - name: Build Tauri (Linux)
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Loadout ${{ github.ref_name }}'
          releaseBody: 'CLI + 桌面端 + 服务端'
          releaseDraft: false

      - name: Build Tauri (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Loadout ${{ github.ref_name }}'
          releaseBody: 'CLI + 桌面端 + 服务端'
          releaseDraft: false
          args: --target universal-apple-darwin

      - name: Build Tauri (Windows)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Loadout ${{ github.ref_name }}'
          releaseBody: 'CLI + 桌面端 + 服务端'
          releaseDraft: false

  # 收集 CLI 产物到 Release
  release-cli:
    needs: [cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
