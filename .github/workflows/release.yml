name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # CLI 多平台原生构建
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: loadout-linux-amd64
            ext: ""
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: loadout-linux-arm64
            ext: ""
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: loadout-windows-amd64
            ext: ".exe"
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: loadout-darwin-arm64
            ext: ""
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            name: loadout-darwin-amd64
            ext: ""
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install cross (Linux)
        if: runner.os == 'Linux'
        run: cargo install cross

      - name: Build (Linux cross)
        if: runner.os == 'Linux'
        run: cross build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}

      - name: Build (native)
        if: runner.os != 'Linux'
        run: cargo build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd cli/target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../../${{ matrix.name }}.zip loadout${{ matrix.ext }}
          else
            tar czf ../../../${{ matrix.name }}.tar.gz loadout${{ matrix.ext }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cli/${{ matrix.name }}.*

  # Docker 镜像
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tauri 桌面端
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Install deps & build desktop UI
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop/ui build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Loadout ${{ github.ref_name }}'
          releaseBody: |
            ## 产物

            ### CLI（终端用）
            - `loadout-linux-amd64.tar.gz` / `loadout-linux-arm64.tar.gz`
            - `loadout-darwin-arm64.tar.gz` / `loadout-darwin-amd64.tar.gz`
            - `loadout-windows-amd64.zip`

            ### 桌面端（图形界面）
            - Linux `.deb` / `.AppImage`
            - macOS `.dmg`（universal）
            - Windows `.msi` / `.exe`

            ### 服务端
            - `ghcr.io/yanyutin753/loadout:v0.2.0`
          releaseDraft: false

  # 收集 CLI 产物到 Release
  release-cli:
    needs: [cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
